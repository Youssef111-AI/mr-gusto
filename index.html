<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Mr Gusto Cafe — Premium Coffee & Restaurant. Where every sip feels like home.">
  <meta name="theme-color" content="#1C120F">
  <meta property="og:title" content="Mr Gusto Cafe">
  <meta property="og:description" content="Premium Coffee & Restaurant. Where every sip feels like home.">
  <title>Mr Gusto Cafe</title>
  <link rel="icon" href="https://res.cloudinary.com/dwhkjr77b/image/upload/v1750708177/MR_GUSTO-02-modified_ukvcl8.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Intro Screen -->
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-bg"></div>
    <div class="intro-content">
      <img src="https://res.cloudinary.com/dwhkjr77b/image/upload/v1786771807/%D9%84%D9%88%D8%AC%D9%88_cryqjn.png" alt="Mr Gusto Cafe Logo" class="intro-logo">
      <svg class="intro-svg" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
        <text x="200" y="45" class="svg-welcome">Welcome</text>
        <text x="200" y="85" class="svg-to">to</text>
        <text x="200" y="135" class="svg-mr-gusto">Mr Gusto</text>
        <text x="200" y="225" class="svg-cafe">CAFE</text>
      </svg>
    </div>
    <button class="intro-skip" id="introSkip">Skip Intro</button>
  </div>

  <div class="bg-layer"></div>
  <div class="particles" id="particles"></div>
  <div class="noise-overlay"></div>

  <main class="container">

    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="https://res.cloudinary.com/dwhkjr77b/image/upload/v1786771807/%D9%84%D9%88%D8%AC%D9%88_cryqjn.png" alt="Mr Gusto Cafe Logo" class="logo-img" loading="eager">
      </div>
    </div>

    <h1 class="brand-title">
      <span class="line1">Welcome</span>
      <span class="line2">to Mr Gusto Cafe</span>
    </h1>
    <p class="brand-subtitle">Coffee & Restaurant</p>

    <div class="divider"></div>

    <!-- Square Buttons Grid (2x2) -->
    <div class="square-grid">
      <a href="menu" class="square-btn glass">
        <i class="fa-solid fa-utensils"></i>
        <span>Menu</span>
      </a>
      <button class="square-btn glass" id="socialBtn">
        <i class="fa-solid fa-share-nodes"></i>
        <span>Follow Us</span>
      </button>
      <a href="https://maps.google.com/?q=Mr+Gusto+Cafe" target="_blank" rel="noopener" class="square-btn glass">
        <i class="fa-solid fa-location-dot"></i>
        <span>Location</span>
      </a>
      <a href="tel:01091976787" class="square-btn glass">
        <i class="fa-solid fa-phone"></i>
        <span>Call Us</span>
      </a>
    </div>

    <!-- Google Rate Button -->
    <a href="https://search.google.com/local/writereview?placeid=ChIJgzeNaQA1-BQRTiyrounHOaM" target="_blank" rel="noopener" class="google-btn">
      <i class="fa-brands fa-google"></i>
      <span>Rate us on Google</span>
    </a>

    <!-- Social Media Icons -->
    <div class="social-icons">
      <a href="https://www.instagram.com/mr.gustocafe/" target="_blank" rel="noopener" class="social-icon" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.facebook.com/p/Mr-Gusto-restaurant-cafe-61575681950960/" target="_blank" rel="noopener" class="social-icon" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="https://www.tiktok.com/@mr.gusto.cafe" target="_blank" rel="noopener" class="social-icon" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="https://wa.me/201091976787" target="_blank" rel="noopener" class="social-icon" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>

    <!-- Info Row -->
    <div class="info-row">
      <div class="info-chip">
        <i class="fa-solid fa-clock"></i>
        <span>11 AM — 1 AM</span>
      </div>
      <div class="info-chip">
        <i class="fa-solid fa-phone"></i>
        <span>0109 197 6787</span>
      </div>
    </div>

  </main>

  <!-- Social Modal -->
  <div class="social-modal" id="socialModal" role="dialog" aria-label="Social media links" aria-hidden="true">
    <button class="social-modal__close" id="socialModalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <div class="social-modal__content">
      <div class="social-modal__header">
        <h2>Follow Us</h2>
        <p>Stay connected with Mr Gusto Cafe</p>
      </div>
      <div class="social-modal__grid">
        <a href="https://www.instagram.com/mr.gustocafe/" target="_blank" rel="noopener" class="social-modal__item">
          <i class="fa-brands fa-instagram" style="color: #E4405F;"></i>
          <span>Instagram</span>
        </a>
        <a href="https://www.facebook.com/p/Mr-Gusto-restaurant-cafe-61575681950960/" target="_blank" rel="noopener" class="social-modal__item">
          <i class="fa-brands fa-facebook-f" style="color: #1877F2;"></i>
          <span>Facebook</span>
        </a>
        <a href="https://www.tiktok.com/@mr.gusto.cafe" target="_blank" rel="noopener" class="social-modal__item">
          <i class="fa-brands fa-tiktok" style="color: #fff;"></i>
          <span>TikTok</span>
        </a>
        <a href="https://wa.me/201091976787" target="_blank" rel="noopener" class="social-modal__item">
          <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i>
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Mr Gusto Cafe — All Rights Reserved</p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
